[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates come from Tauri itself; only our direct dependencies are gated.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
