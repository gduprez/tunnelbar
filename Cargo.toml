[workspace]
resolver = "3"
members = ["crates/tunnelbar-core", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gduprez/tunnelbar"
authors = ["Guillaume Duprez <5592436+gduprez@users.noreply.github.com>"]

[workspace.lints.rust]
# Denied everywhere; only src-tauri/src/login_item.rs (Objective-C bindings, macOS) and
# crates/tunnelbar-core/src/linux.rs (pre_exec, Linux) allow it.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
