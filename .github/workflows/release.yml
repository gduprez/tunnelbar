name: Release

# release-please keeps a release pull request up to date from Conventional Commits.
# Merging it tags vX.Y.Z and creates the GitHub release; the macOS job then attaches
# the universal .dmg and updates the Homebrew tap.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      # Developer ID signing and notarization turn on by adding these repository secrets;
      # without them the app is ad-hoc signed ("signingIdentity": "-" in tauri.conf.json).
      - name: Use Apple signing secrets when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<EOF"; echo "${!name}"; echo "EOF"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build the universal app and disk image
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Attach the disk image to the release
        run: |
          dmg="TunnelBar_${VERSION}_universal.dmg"
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "$dmg"
          shasum -a 256 "$dmg" | tee "$dmg.sha256"
          gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber
          echo "SHA256=$(cut -d' ' -f1 "$dmg.sha256")" >> "$GITHUB_ENV"

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set: skipping the tap update."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/gduprez/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/{{VERSION}}/${VERSION}/" -e "s/{{SHA256}}/${SHA256}/" \
            packaging/homebrew/tunnelbar.rb.template > tap/Casks/tunnelbar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tunnelbar.rb
          git commit -m "tunnelbar ${VERSION}"
          git push
