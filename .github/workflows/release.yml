name: Release

# release-please keeps a release pull request up to date from Conventional Commits.
# Merging it tags vX.Y.Z and creates the GitHub release. The build jobs then make the
# packages with a read-only token, and the publish job, which runs no build code, attaches
# them to the release and updates the Homebrew tap.
#
# Release builds start from scratch (no cache): a cache written by an earlier CI run
# could otherwise slip code into the published packages.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci

      # Developer ID signing and notarization turn on by adding these repository secrets;
      # without them the app is ad-hoc signed ("signingIdentity": "-" in tauri.conf.json).
      - name: Use Apple signing secrets when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A random delimiter: no secret line can end the value early.
          delimiter="END_$(openssl rand -hex 16)"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build the universal app and disk image
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Name the disk image after the version
        run: |
          mkdir packages
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "packages/TunnelBar_${VERSION}_universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: packages/
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the system libraries of Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: npm ci
      - name: Build the .deb and the AppImage
        run: npx tauri build --bundles deb,appimage
      - name: Name the packages after the version
        run: |
          mkdir packages
          cp target/release/bundle/deb/*.deb "packages/TunnelBar_${VERSION}_amd64.deb"
          cp target/release/bundle/appimage/*.AppImage \
            "packages/TunnelBar_${VERSION}_amd64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: packages/
          if-no-files-found: error
          retention-days: 1

  # The only job with write access: it runs no dependency or build code.
  publish:
    needs: [release-please, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          dmg="TunnelBar_${VERSION}_universal.dmg"
          deb="TunnelBar_${VERSION}_amd64.deb"
          appimage="TunnelBar_${VERSION}_amd64.AppImage"
          for file in "$dmg" "$deb" "$appimage"; do
            sha256sum "$file" | tee "$file.sha256"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$dmg" "$dmg.sha256" "$deb" "$deb.sha256" "$appimage" "$appimage.sha256"
          echo "SHA256=$(cut -d' ' -f1 "$dmg.sha256")" >> "$GITHUB_ENV"

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set: skipping the tap update."
            exit 0
          fi
          # The token goes in a request header, never in the remote URL or .git/config.
          encoded="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$encoded"
          auth="AUTHORIZATION: basic $encoded"
          git -c http.https://github.com/.extraheader="$auth" \
            clone https://github.com/gduprez/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/{{VERSION}}/${VERSION}/" -e "s/{{SHA256}}/${SHA256}/" \
            packaging/homebrew/tunnelbar.rb.template > tap/Casks/tunnelbar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tunnelbar.rb
          git commit -m "tunnelbar ${VERSION}"
          git -c http.https://github.com/.extraheader="$auth" push
