# Weekly dependency updates. Actions are pinned by commit SHA; Dependabot keeps those pins up
# to date. Minor and patch updates are grouped to keep the pull requests few.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # TypeScript 7 (native compiler) checks the code fine, but typescript-eslint and
      # svelte-check do not support it yet: try again once they do.
      - dependency-name: typescript
        versions: ['>=7']
      # Types follow the Node.js major of .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
